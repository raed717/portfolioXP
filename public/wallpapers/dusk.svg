<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Original illustration: dunes at dusk with a low sun and first stars (THEME_CONTEXT §3.6). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f5c"/>
      <stop offset=".45" stop-color="#6b3f8f"/>
      <stop offset=".75" stop-color="#e2735a"/>
      <stop offset="1" stop-color="#f7c46c"/>
    </linearGradient>
    <radialGradient id="sun" cx="1180" cy="760" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset=".2" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5566a"/>
      <stop offset="1" stop-color="#7a3358"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9824f"/>
      <stop offset="1" stop-color="#94443f"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a95c"/>
      <stop offset="1" stop-color="#b15a3a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="210" cy="120" r="2.2" opacity=".9"/>
    <circle cx="460" cy="70" r="1.6" opacity=".7"/>
    <circle cx="720" cy="160" r="2" opacity=".8"/>
    <circle cx="980" cy="90" r="1.4" opacity=".6"/>
    <circle cx="1390" cy="130" r="2.2" opacity=".85"/>
    <circle cx="1650" cy="60" r="1.6" opacity=".7"/>
    <circle cx="1820" cy="190" r="1.8" opacity=".75"/>
    <circle cx="330" cy="260" r="1.3" opacity=".5"/>
    <circle cx="1530" cy="280" r="1.3" opacity=".5"/>
  </g>
  <circle cx="1180" cy="760" r="300" fill="url(#sun)"/>
  <circle cx="1180" cy="760" r="78" fill="#fff3d1"/>
  <path d="M0 720 Q 300 640 620 700 T 1260 690 T 1920 650 V1080 H0z" fill="url(#far)"/>
  <path d="M0 820 C 340 700 720 760 1000 800 S 1560 740 1920 790 V1080 H0z" fill="url(#mid)"/>
  <path d="M0 930 C 420 820 860 860 1240 930 C 1500 980 1720 960 1920 920 V1080 H0z" fill="url(#near)"/>
  <path d="M0 930 C 420 820 860 860 1240 930" fill="none" stroke="#ffd9a0" stroke-width="4" opacity=".5"/>
</svg>
